name: Release R6 core jars

# Builds the R5 core jars (with R6 ballot compatibility patches) plus the
# validator CLI fat jar, and publishes them as a GitHub release tagged
# r5-${R6_LABEL}-<timestamp>. The companion glichtner/fhir-ig-publisher
# release workflow consumes the module jars.

on:
  push:
    branches: [master]
    paths:
      - 'org.hl7.fhir.r5/**'
      - 'org.hl7.fhir.r4/**'
      - 'org.hl7.fhir.r4b/**'
      - 'org.hl7.fhir.utilities/**'
      - 'org.hl7.fhir.convertors/**'
      - 'org.hl7.fhir.validation/**'
      - 'org.hl7.fhir.validation.cli/**'
      - '.github/workflows/release-r6.yml'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: write

env:
  R6_LABEL: ballot5

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build core modules and validator CLI
        run: |
          mvn install -pl org.hl7.fhir.validation.cli -am \
            -Dmaven.test.skip=true -Dmaven.javadoc.skip=true --no-transfer-progress

      - name: Read project version
        id: ver
        run: |
          V=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Core project version: $V"

      - name: Build release tag
        id: tag
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          TAG="r5-${R6_LABEL}-${STAMP}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "stamp=$STAMP" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"

      - name: Collect artifact jars
        run: |
          mkdir -p artifacts
          for m in org.hl7.fhir.utilities org.hl7.fhir.r4 org.hl7.fhir.r4b org.hl7.fhir.r5 org.hl7.fhir.convertors org.hl7.fhir.validation; do
            cp "$m/target/$m-${{ steps.ver.outputs.version }}.jar" artifacts/
          done
          cp "org.hl7.fhir.validation.cli/target/org.hl7.fhir.validation.cli-${{ steps.ver.outputs.version }}.jar" artifacts/validator_cli.jar
          ls -la artifacts/

      - name: Write release notes
        run: |
          cat > /tmp/notes.md <<EOF
          # R5 core jars with R6 ${{ env.R6_LABEL }} compatibility patches

          Built from \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`
          Project version: \`${{ steps.ver.outputs.version }}\`

          ## What's in here
          - R5 core jars patched to parse and validate R6 ${{ env.R6_LABEL }} IGs (via the
            existing \`R6ToR5Loader\` mechanism in upstream IG Publisher). See commit log
            for the full list of ballot spec deltas handled.
          - \`validator_cli.jar\` — the validator CLI fat jar built from the same sources
            (use in place of the official validator for R6 ${{ env.R6_LABEL }} content).

          ## Consuming
          The companion \`glichtner/fhir-ig-publisher\` release workflow downloads the
          module jars, installs them as \`ca.uhn.hapi.fhir:org.hl7.fhir.*:${{ steps.ver.outputs.version }}\`
          into the local Maven repo, and builds the IG Publisher CLI against them.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: R5 core ${{ env.R6_LABEL }} ${{ steps.tag.outputs.stamp }}
          body_path: /tmp/notes.md
          files: artifacts/*
          draft: false
          prerelease: false
